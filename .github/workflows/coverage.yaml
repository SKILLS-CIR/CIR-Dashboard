name: NestJS Coverage Badge

on:
  push:
    branches:
      - main

env:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: postgres
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public
  JWT_SECRET: super-secret-jwt-key-for-testing

jobs:
  coverage-badge:
    name: Run NestJS Tests and Generate Coverage Badge
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        node-version: ["20.x"]

    permissions:
      contents: write
      checks: write
      pull-requests: write

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out source repository
        uses: actions/checkout@v4

      - name: Set up Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply Prisma Migrations
        run: npx prisma migrate deploy

      - name: Run NestJS tests with verbose logging and coverage
        run: npm run test:cov -- --verbose --coverageReporters="text" --coverageReporters="json-summary"

      - name: Display Coverage Summary
        if: always()
        run: |
          echo "=========================================="
          echo "       TEST COVERAGE SUMMARY"
          echo "=========================================="
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const c = require('./coverage/coverage-summary.json').total;
              console.log('Statements : ' + c.statements.pct + '%');
              console.log('Branches   : ' + c.branches.pct + '%');
              console.log('Functions  : ' + c.functions.pct + '%');
              console.log('Lines      : ' + c.lines.pct + '%');
            "
          else
            echo "Coverage summary not found."
          fi
          echo "=========================================="

      - name: Generate Coverage Badge
        run: npx make-coverage-badge --output-path ./coverage.svg

      - name: Check for changes
        id: check_changes
        run: |
          if git status --porcelain coverage.svg | grep -q .; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit coverage badge
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add coverage.svg
          git commit -m "chore: update test coverage badge [skip ci]"

      - name: Push changes
        if: steps.check_changes.outputs.changed == 'true'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
